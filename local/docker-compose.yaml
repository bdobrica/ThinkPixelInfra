services:
  # Redis with Sentinel for local development
  # Using different ports to avoid conflicts with local Redis installation
  redis-primary:
    image: redis/redis-stack-server:7.4.0-v0
    container_name: redis-primary
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no", "--loadmodule", "/opt/redis-stack/lib/redisearch.so"]
    # No external port exposure needed - only accessed via Sentinel internally
    volumes:
      - redis-primary-data:/data
    networks:
      default:
        aliases:
          - redis-master

  redis-sentinel:
    build:
      context: ../docker/sentinel
      dockerfile: Dockerfile
    container_name: redis-sentinel
    ports:
      - "26380:26379"  # Use 26380 externally to avoid conflicts
    depends_on:
      - redis-primary
    networks:
      default:
        aliases:
          - redis-sentinel

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API

  mpnetv2:
    build:
      context: ../docker/models/mpnetv2
      dockerfile: Dockerfile
    container_name: model
    #volumes:
    #  - ../docker/models/weights/mpnetv2/mpnet-base-v2:/app/mpnet-base-v2
    ports:
      - "8000:8000"
    environment:
      - LOCAL=1

  # Snowflake Arctic - Alternative model (disabled by default)
  # To use: uncomment this service, comment out mpnetv2, and update api-gateway dependencies
  # snowflake-arctic:
  #   build:
  #     context: ../docker/models/snowflake-arctic
  #     dockerfile: Dockerfile
  #   container_name: snowflake-arctic
  #   # volumes:
  #   #   - ../docker/models/snowflake-arctic/weights:/app/snowflake-arctic
  #   ports:
  #     - "8001:8000"  # Use different external port to avoid conflicts
  #   environment:
  #     - LOCAL=1

  mysql:
    image: mysql:9.5.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thinkpixel
      MYSQL_USER: thinkpixel
      MYSQL_PASSWORD: thinkpixel
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  nats:
    image: nats:2.12.3-scratch
    container_name: nats
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # Monitoring endpoint

  api-gateway:
    build:
      context: ../docker/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - LOCAL=1
      - API_GATEWAY_ENABLE_INSECURE_VALIDATION=1
      - API_GATEWAY_VALIDATION_MAX_ATTEMPTS=10
      - API_GATEWAY_DLQ_REDIS_ADDR=redis-sentinel:26379/mymaster
      - API_GATEWAY_DLQ_REDIS_PASSWORD=
      - API_GATEWAY_DLQ_REDIS_DB=0
      - API_GATEWAY_NATS_URL=nats://nats:4222
      - API_GATEWAY_DOCUMENT_QUEUE_SUBJECT=store.jobs
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - qdrant
      - nats
      - mpnetv2
      #- snowflake-arctic

  mock-site:
    build:
      context: ./mock_site
      dockerfile: Dockerfile
    container_name: mock-site
    networks:
      default:
        aliases:
          - example.com
    ports:
      - "8081:80"

volumes:
  redis-primary-data:
  mysql-data:
  qdrant-data:
