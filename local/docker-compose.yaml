services:
  redis-primary:
    image: redis/redis-stack:latest
    container_name: redis-primary
    command: [ "redis-stack-server", "--appendonly", "yes", "--protected-mode", "no" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-primary-data:/data

  redis-replica:
    image: redis/redis-stack:latest
    container_name: redis-replica
    command: [ "redis-stack-server", "--appendonly", "yes", "--replicaof", "redis-primary", "6379", "--protected-mode", "no" ]
    depends_on:
      - redis-primary
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-data:/data

  redis-sentinel:
    build:
      context: ../docker/sentinel
      dockerfile: Dockerfile
    container_name: redis-sentinel
    ports:
      - "26379:26379"
    depends_on:
      - redis-primary
      - redis-replica

  model:
    build:
      context: ../docker/model
      dockerfile: Dockerfile
    container_name: model
    volumes:
      - ../docker/model/weights/mpnetv2/mpnet-base-v2:/app/mpnet-base-v2
    ports:
      - "8000:8000"
    environment:
      - LOCAL=1

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thinkpixel
      MYSQL_USER: thinkpixel
      MYSQL_PASSWORD: thinkpixel
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

  api-gateway:
    build:
      context: ../docker/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - LOCAL=1
    ports:
      - "8081:8081"
    depends_on:
      - model
      - redis-sentinel

volumes:
  redis-primary-data:
  redis-replica-data:
  mysql-data:
