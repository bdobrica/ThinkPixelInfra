---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/version: 0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: master
    spec:
      containers:
        - name: redis-master
          image: redis/redis-stack:latest
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 2Gi
              cpu: 250m
          envFrom:
            - secretRef:
                name: redis-secret
          command:
            - /bin/sh
            - -c
            - |
              redis-stack-server \
              --appendonly yes \
              --requirepass ${REDIS_PASSWORD} \
              --maxmemory 1800mb
          ports:
            - containerPort: 6379
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - redis
              topologyKey: kubernetes.io/hostname
