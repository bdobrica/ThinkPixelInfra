apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-model
  template:
    metadata:
      labels:
        app: ml-model
    spec:
      containers:
        - name: ml-model
          image: quay.io/bdobrica/thinkpixel-model-multi:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: 1500m
              memory: 3Gi
            requests:
              cpu: 1000m
              memory: 2Gi
      imagePullSecrets:
        - name: quay-io-credentials

