apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vectordb
spec:
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/component: vectordb
  serviceName: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/component: vectordb
    spec:
      initContainers:
      - name: ensure-dir-ownership
        image: docker.io/qdrant/qdrant:v1.13.4
        command:
          - chown
          - -R
          - 1000:2000
          - /qdrant/storage
          - /qdrant/snapshots
          - /qdrant/snapshot-restoration
        volumeMounts:
          - name: qdrant-storage
            mountPath: /qdrant/storage
          - name: qdrant-snapshots
            mountPath: /qdrant/snapshots
          - name: qdrant-snapshot-restoration
            mountPath: /qdrant/snapshot-restoration
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.13.4 
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: qdrant-secret
          env:
            - name: QDRANT_INIT_FILE_PATH
              value: /qdrant/init/.qdrant-initialized
          command: ["/bin/bash", "-c"]
          args:
            - ./config/initialize.sh
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
            - name: p2p
              containerPort: 6335
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          volumeMounts:
          - name: qdrant-storage
            mountPath: /qdrant/storage
          - name: qdrant-config
            mountPath: /qdrant/config/initialize.sh
            subPath: initialize.sh
          - name: qdrant-config
            mountPath: /qdrant/config/production.yaml
            subPath: production.yaml
          - name: qdrant-snapshots
            mountPath: /qdrant/snapshots
          - name: qdrant-snapshot-restoration
            mountPath: /qdrant/snapshot-restoration
          - name: qdrant-init
            mountPath: /qdrant/init
      securityContext:
        fsGroup: 3000
        fsGroupChangePolicy: Always
      serviceAccountName: qdrant
      volumes:
        - name: qdrant-config
          configMap:
            name: qdrant-config
            defaultMode: 0755
        - name: qdrant-snapshots
          persistentVolumeClaim:
            claimName: qdrant-snapshots
        - name: qdrant-snapshot-restoration
          persistentVolumeClaim:
            claimName: qdrant-snapshot-restoration
        - name: qdrant-init
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
        labels:
          app.kubernetes.io/name: qdrant
          app.kubernetes.io/component: vectordb
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: qdrant-snapshots
        labels:
          app.kubernetes.io/name: qdrant
          app.kubernetes.io/component: vectordb
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: qdrant-snapshot-restoration
        labels:
          app.kubernetes.io/name: qdrant
          app.kubernetes.io/component: vectordb
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
