apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: 0.1.0
data:
  API_GATEWAY_JWT_SECRET: supersecret
  API_GATEWAY_MYSQL_HOST: mysql
  API_GATEWAY_MYSQL_PORT: "3306"
  API_GATEWAY_MYSQL_USER: thinkpixel
  API_GATEWAY_MYSQL_DB: thinkpixel
  API_GATEWAY_VALIDATION_SUFFIX: "?rest_route=/thinkpixel/v1/validate/"
  API_GATEWAY_VALIDATION_TIMEOUT: 5s
  API_GATEWAY_VALIDATION_MAX_ATTEMPTS: "3"
  LOCAL: "1"


