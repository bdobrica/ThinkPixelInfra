resources:
  - ../../base/namespace
  - ../../base/secrets
  - ../../base/mysql
  - ../../base/api-gateway
  - ./redis
  - ./models

namespace: thinkpixel

patches:
  - path: patches/redis-sealed-secret.yaml
    target:
      kind: SealedSecret
      name: redis-secret
  - path: patches/mysql-sealed-secret.yaml
    target:
      kind: SealedSecret
      name: mysql-secret
  - path: patches/quay-io-sealed-secret.yaml
    target:
      kind: SealedSecret
      name: quay-io-secret
