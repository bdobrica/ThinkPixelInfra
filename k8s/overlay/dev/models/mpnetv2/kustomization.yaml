resources:
  - ../../../../base/ml-model

namespace: thinkpixel

patches:
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: mpnetv2
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: mpnetv2
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: mpnetv2
  - target:
      kind: Service
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: mpnetv2
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: mpnetv2
