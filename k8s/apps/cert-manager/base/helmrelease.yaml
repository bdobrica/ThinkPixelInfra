apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  releaseName: cert-manager
  targetNamespace: cert-manager
  serviceAccountName: flux-operator
  chart:
    spec:
      chart: cert-manager
      version: "v1.*"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-${ENVIRONMENT}
      valuesKey: values.yaml
