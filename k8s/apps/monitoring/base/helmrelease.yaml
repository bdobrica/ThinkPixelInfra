apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  releaseName: monitoring
  serviceAccountName: flux-operator
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "45.*"
      sourceRef:
        kind: HelmRepository
        name: monitoring
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: monitoring
      valuesKey: values.yaml
