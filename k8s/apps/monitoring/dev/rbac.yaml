---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-kube-prometheus-flux
rules:
  # allow creating CRDs (can't reliably restrict by name for create)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create"]

  # restrict mutation of existing CRDs by name
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - alertmanagers.monitoring.coreos.com
      - alertmanagerconfigs.monitoring.coreos.com
      - prometheuses.monitoring.coreos.com
      - prometheusrules.monitoring.coreos.com
      - servicemonitors.monitoring.coreos.com
      - podmonitors.monitoring.coreos.com
      - probes.monitoring.coreos.com
      - thanosrulers.monitoring.coreos.com
    verbs: ["update", "patch", "delete"]

  # allow reading ClusterRoles
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - monitoring-grafana-clusterrole
      - monitoring-kube-prometheus-operator
      - monitoring-kube-prometheus-prometheus
      - monitoring-kube-state-metrics
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # allow reading ClusterRoleBindings for existing bindings
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames:
      - monitoring-grafana-clusterrolebinding
      - monitoring-kube-prometheus-operator
      - monitoring-kube-prometheus-prometheus
      - monitoring-kube-state-metrics
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-kube-prometheus-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-kube-prometheus-flux
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-kube-prometheus-flux
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames:
      - monitoring-kube-prometheus-coredns
      - monitoring-kube-prometheus-kube-controller-manager
      - monitoring-kube-prometheus-kube-etcd
      - monitoring-kube-prometheus-kube-proxy
      - monitoring-kube-prometheus-kube-scheduler
      - monitoring-kube-prometheus-kubelet
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-kube-prometheus-flux
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-kube-prometheus-flux
