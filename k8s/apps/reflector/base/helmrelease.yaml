apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  releaseName: reflector
  serviceAccountName: flux-operator
  chart:
    spec:
      chart: reflector
      version: "9.*"
      sourceRef:
        kind: HelmRepository
        name: reflector
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: reflector-${ENVIRONMENT}
      valuesKey: values.yaml
