apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  releaseName: reflector
  serviceAccountName: flux-operator
  targetNamespace: reflector
  chart:
    spec:
      chart: kubernetes-reflector
      version: "9.*"
      sourceRef:
        kind: HelmRepository
        name: reflector
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: reflector
      valuesKey: values.yaml
