apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: nats
spec:
  releaseName: nats
  chart:
    spec:
      chart: nats
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: nats
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: nats
      valuesKey: values.yaml
