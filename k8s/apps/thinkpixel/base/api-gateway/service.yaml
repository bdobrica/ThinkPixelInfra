---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: 0.1.0
  annotations:
    load-balancer.hetzner.cloud/name: k8s-worker-lb
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: api-gateway
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-metrics
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: 0.1.0
spec:
  ports:
    - port: 2020
      targetPort: 2020
  selector:
    app.kubernetes.io/name: api-gateway
  type: ClusterIP
