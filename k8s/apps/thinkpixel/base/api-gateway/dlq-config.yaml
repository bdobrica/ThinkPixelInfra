apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-dlq-config
  namespace: thinkpixel
data:
  # Redis connection for DLQ (can use existing Redis or dedicated instance)
  API_GATEWAY_DLQ_REDIS_ADDR: "redis-master:6379"

  # DLQ behavior settings
  API_GATEWAY_DLQ_TTL: "24h"                    # Keep messages for 24 hours in Redis
  API_GATEWAY_DLQ_THRESHOLD: "100"              # Alert after 100 failures per site
  API_GATEWAY_DLQ_THRESHOLD_WINDOW: "1h"        # Within 1 hour window

  # Export settings (for S3 archival via FluentBit)
  API_GATEWAY_DLQ_EXPORT_ENABLED: "true"
  API_GATEWAY_DLQ_EXPORT_INTERVAL: "6h"         # Export every 6 hours
  API_GATEWAY_DLQ_EXPORT_PATH: "/var/log/api-gateway/dlq"

---
# Example usage in deployment:
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: api-gateway
# spec:
#   template:
#     spec:
#       containers:
#       - name: api-gateway
#         envFrom:
#         - configMapRef:
#             name: api-gateway-dlq-config
#         - secretRef:
#             name: redis-secret  # Contains API_GATEWAY_REDIS_PASSWORD
