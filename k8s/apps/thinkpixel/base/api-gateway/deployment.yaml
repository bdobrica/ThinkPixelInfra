---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: 0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      tolerations:
        - key: "dev.thinkpixel.io/taint"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
      volumes:
        - name: request-logs
          emptyDir: {}
        - name: dlq-logs
          emptyDir: {}
        - name: nats-tls-secret
          secret:
            secretName: nats-tls-secret
        - name: nats-nkey-secret
          secret:
            secretName: nats-nkey-secret
        - name: fluent-bit-storage
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
      containers:
        - name: api-gateway
          image: quay.io/bdobrica/thinkpixel-api-gateway-multi:0.6.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: redis-secret
            - secretRef:
                name: qdrant-secret
            - secretRef:
                name: mysql-secret
            - secretRef:
                name: api-gateway-secret
          env:
            - name: API_GATEWAY_SITE_DB_DSN
              value: "$(API_GATEWAY_MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(API_GATEWAY_MYSQL_HOST):$(API_GATEWAY_MYSQL_PORT))/$(API_GATEWAY_MYSQL_DB)"
            - name: API_GATEWAY_REDIS_PASSWORD
              value: "$(REDIS_PASSWORD)"
            - name: API_GATEWAY_QDRANT_API_KEY
              value: "$(QDRANT__SERVICE__API_KEY)"
            - name: API_GATEWAY_MODEL_TIMEOUT
              value: "30s"
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: request-logs
              mountPath: /var/log/api-gateway
            - name: dlq-logs
              mountPath: /var/log/api-gateway/dlq
            - name: nats-tls-secret
              mountPath: /etc/nats/tls
              readOnly: true
            - name: nats-nkey-secret
              mountPath: /etc/nats/nkeys
              readOnly: true
        - name: fluentbit
          image: fluent/fluent-bit:3.2.6
          ports:
            - containerPort: 2020
          envFrom:
            - secretRef:
                name: fluent-bit-secret
          env:
            - name: FLUENT_BIT_S3_BUCKET
              value: dev-thinkpixel-request-logs
            - name: FLUENT_BIT_S3_ENDPOINT
              value: https://fsn1.your-objectstorage.com
            - name: FLUENT_BIT_CLUSTER_NAME
              value: dev.thinkpixel.io
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 256Mi
          args:
            - "-c"
            - "/fluent-bit/etc/fluent-bit.conf"
          volumeMounts:
            - name: request-logs
              mountPath: /var/log/api-gateway
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
            - name: fluent-bit-storage
              mountPath: /tmp/fluent-bit
      imagePullSecrets:
        - name: quay-io-secret
