---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-model
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-model
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-model
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-model
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
