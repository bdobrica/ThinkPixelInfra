---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpnetv2
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mpnetv2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mpnetv2
    spec:
      containers:
        - name: ml-model
          image: quay.io/bdobrica/thinkpixel-mpnetv2-multi:0.1.6
          resources:
            limits:
              memory: 3Gi
            requests:
              cpu: 1000m
              memory: 3Gi
