---
resources:
  - ../../../base/ml-model

patches:
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: snowflake-arctic
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: snowflake-arctic
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: snowflake-arctic
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/labelSelector/matchLabels/app.kubernetes.io~1name
        value: snowflake-arctic
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/bdobrica/thinkpixel-snowflake-arctic-multi:0.1.13
  - target:
      kind: Service
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: snowflake-arctic
      - op: replace
        path: /spec/selector/app.kubernetes.io~1name
        value: snowflake-arctic
  - target:
      kind: PodDisruptionBudget
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: snowflake-arctic
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: snowflake-arctic
  - target:
      kind: HorizontalPodAutoscaler
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: snowflake-arctic
      - op: replace
        path: /spec/scaleTargetRef/name
        value: snowflake-arctic
