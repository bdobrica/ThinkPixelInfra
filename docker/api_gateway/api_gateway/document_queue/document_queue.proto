syntax = "proto3";

package documentqueue;
option go_package = "api_gateway/document_queue";

enum MessageStatus {
  PENDING = 0;
  PROCESSING = 1;
  COMPLETED = 2;
  FAILED = 3;
  DEAD_LETTER = 4;
}

message DocumentQueuePayload {
  int32 site_id = 1;
  int32 id = 2;
  string text = 3;
  map<string, string> extra = 4;
  int64 timestamp_millis = 5;
  int32 retry_count = 6;
  int32 max_retries = 7;
  MessageStatus status = 8;
  string error_message = 9;
  int64 last_retry_timestamp = 10;
  string language = 11;
}
