packages:
  - curl
users:
  - name: cluster
    ssh-authorized-keys:
      - {management_public_ssh_key}
      - {master_public_ssh_key}
      - {worker_public_ssh_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
write_files:
  - path: /root/.ssh/id_rsa
    content: |
      {master_private_ssh_key}
    permissions: "0600"
runcmd:
  - apt-get update -y
  - # install k3s master, disable traefik
  - curl https://get.k3s.io | INSTALL_K3S_EXEC="server --disable traefik --cluster-domain ${cluster_domain}" sh -
  - # change ownership of k3s configuration files
  - chown cluster:cluster /etc/rancher/k3s/k3s.yaml
  - chown cluster:cluster /var/lib/rancher/k3s/server/node-token
