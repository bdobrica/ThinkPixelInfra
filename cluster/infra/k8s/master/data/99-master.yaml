packages:
  - curl
users:
  - name: cluster
    ssh-authorized-keys:
      - ${management_public_ssh_key}
      - ${master_public_ssh_key}
      - ${worker_public_ssh_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
write_files:
  - path: /root/.ssh/id_rsa
    content: |
      ${master_private_ssh_key}
    permissions: "0600"
runcmd:
  - apt-get update -y
  - # wait for the master node to be ready by trying to connect to it
  - until curl -k https://${first_node_ip}:6443; do sleep 5; done
  - # copy the token from the master node
  - REMOTE_TOKEN=$(ssh -o StrictHostKeyChecking=accept-new cluster@${first_node_ip} sudo cat /var/lib/rancher/k3s/server/node-token)
  - # install k3s additional master
  - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --server https://${first_node_ip}:6443" K3S_TOKEN=$REMOTE_TOKEN sh -
